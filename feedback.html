<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משוב ודיווח | מפות אופליין</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #221D1A;
    --cream: #FBF3E7;
    --cream-2: #F3E6D3;
    --orange: #E8620C;
    --orange-deep: #C24C05;
    --line: #D8C6AE;
    --muted: #8B7A65;
    --white: #ffffff;
    --shadow: 0 20px 40px -15px rgba(34,29,26,.15);
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Heebo', sans-serif;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* --- Animations --- */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .animate-fade { animation: fadeInUp 0.6s ease-out forwards; }
  .animate-scale { animation: scaleIn 0.5s ease-out forwards; }

  .wrap {
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
    padding: 24px;
  }

  /* --- Header Bar --- */
  .header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0;
    margin-bottom: 20px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    text-decoration: none;
    color: var(--ink);
    font-family: 'Rubik', sans-serif;
  }

  .brand .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--orange);
    box-shadow: 0 0 0 4px rgba(232,98,12,.15);
  }

  .btn-back-home {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--white);
    border: 1px solid var(--line);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 500;
    text-decoration: none;
    color: var(--muted);
    transition: var(--transition);
  }

  .btn-back-home:hover {
    color: var(--orange);
    border-color: var(--orange);
    transform: translateX(-4px);
  }

  /* --- Content --- */
  h1 {
    font-family: 'Rubik', sans-serif;
    font-weight: 900;
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    margin: 0 0 10px 0;
    letter-spacing: -0.02em;
  }

  h1 span { color: var(--orange); }

  p.desc {
    color: var(--muted);
    font-size: 1.05rem;
    margin-bottom: 30px;
  }

  /* --- Form Card --- */
  .card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow);
    position: relative;
  }

  .field { margin-bottom: 24px; }

  label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
    font-size: 0.9rem;
    color: var(--ink);
    padding-right: 4px;
  }

  input, textarea {
    width: 100%;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    font-family: inherit;
    font-size: 1rem;
    background: #fcfcfc;
    transition: var(--transition);
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--orange);
    background: var(--white);
    box-shadow: 0 0 0 4px rgba(232,98,12,0.1);
  }

  textarea {
    resize: vertical;
    min-height: 130px;
  }

  .submit-btn {
    width: 100%;
    background: linear-gradient(160deg, var(--orange), var(--orange-deep));
    color: var(--white);
    border: none;
    padding: 18px;
    border-radius: 16px;
    font-family: 'Rubik', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 10px 20px -10px rgba(232,98,12,0.4);
    transition: var(--transition);
  }

  .submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 25px -10px rgba(232,98,12,0.5);
  }

  .submit-btn:active { transform: translateY(-1px); }

  /* --- Success State --- */
  .success-msg {
    display: none;
    text-align: center;
    padding: 20px 0;
  }

  .success-icon {
    font-size: 4rem;
    margin-bottom: 20px;
    display: block;
  }

  /* --- Footer --- */
  footer {
    margin-top: auto;
    padding: 40px 0;
    text-align: center;
  }

  .footer-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
    transition: var(--transition);
  }

  .footer-link:hover { color: var(--orange); }

  @media (max-width: 480px) {
    .card { padding: 24px; }
  }
</style>
</head>
<body>

<div class="wrap animate-fade">
  <div class="header-bar">
    <a href="index.html" class="brand"><span class="dot"></span> מפות אופליין</a>
    <a href="index.html" class="btn-back-home">
      <span>חזרה לדף הבית</span>
      <span style="font-size: 1.1rem; line-height: 1;">←</span>
    </a>
  </div>

  <div id="formContainer">
    <h1>שלחו לנו <span>משוב</span></h1>
    <p class="desc">נתקלתם בבעיה? יש לכם הצעה לשיפור? אנחנו כאן כדי להקשיב.</p>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted){showSuccess();}"></iframe>

    <div class="card">
      <form action="https://docs.google.com/forms/u/0/d/e/1FAIpQLScC2Eh6runcb_Evfxg0_XZWRJ5gJoXeU3VMXe27dhdHpP7pfA/formResponse" 
            method="POST" target="hidden_iframe" onsubmit="submitted=true;">
        
        <div class="field">
          <label for="name">שם מלא *</label>
          <input type="text" id="name" name="entry.820752439" required placeholder="איך לקרוא לך?">
        </div>

        <div class="field">
          <label for="email">כתובת אימייל *</label>
          <input type="email" id="email" name="entry.1011145969" required placeholder="כדי שנוכל להשיב לך">
        </div>

        <div class="field">
          <label for="message">תוכן המשוב *</label>
          <textarea id="message" name="entry.1289732771" required placeholder="מה תרצו לספר לנו?"></textarea>
        </div>

        <button type="submit" class="submit-btn">שליחת משוב</button>
      </form>
    </div>
  </div>

  <div id="successMsg" class="success-msg animate-scale">
    <span class="success-icon">🎉</span>
    <h1>תודה <span>רבה!</span></h1>
    <p class="desc">המשוב התקבל בהצלחה. אנחנו מעריכים את הזמן שהקדשת כדי לעזור לנו להשתפר.</p>
    <a href="index.html" class="submit-btn" style="display:inline-block; text-decoration:none; width:auto; padding:16px 40px; margin-top:10px">חזרה לדף הבית</a>
  </div>

  <footer>
    <a href="index.html" class="footer-link">ביטול וחזרה לדף ההורדות</a>
  </footer>
</div>

<script>
  let submitted = false;
  function showSuccess() {
    document.getElementById('formContainer').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

</body>
</html>
