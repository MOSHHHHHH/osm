name: Offline Maps Data Update Pipeline

on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

jobs:
  run-parallel-tasks:
    runs-on: ubuntu-latest
    outputs:
      osmand_status: ${{ steps.step_data.outputs.osmand_status }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run tag-rule-generator and data-update in parallel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update-scripts/tag-rule-generator.py &
          PID1=$!

          python update-scripts/data-update.py &
          PID2=$!

          wait $PID1
          STATUS1=$?

          wait $PID2
          STATUS2=$?

          if [ $STATUS1 -ne 0 ] || [ $STATUS2 -ne 0 ]; then
            echo "One or both parallel scripts failed. Exiting."
            exit 1
          fi

  run-generator-and-commit:
    needs: run-parallel-tasks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run tag-generator
        run: |
          python update-scripts/tag-generator.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update map data and tags" && git push)
