name: Tag generator (Gemini)

on:
  schedule:
    # 06:00 Israel time (~03:00 UTC in summer / 04:00 UTC in winter). See the comment
    # in data-update.yml about GitHub Actions cron not tracking Israel's DST.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tag-generator
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r update-scripts/requirements.txt

      - name: Run tag-generator.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update-scripts/tag-generator.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mapsTags.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: automatic tag generation ($(date -u +%Y-%m-%d))"
            git push
          fi
