name: Manual - data-update.py only

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Shares the same group as the main pipeline, so this never races the scheduled run.
  group: update-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r update-scripts/requirements.txt
      - name: Run data-update.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u update-scripts/data-update.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/osmand-data.json data/moovitdos-link.json data/update-status.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: manual data update ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          git push
