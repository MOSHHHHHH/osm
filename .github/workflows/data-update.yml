name: Data update (OsmAnd + Moovitdos)

on:
  schedule:
    # Every 3 minutes. Each run only downloads/uploads as many OsmAnd files as fit in a
    # bounded per-run budget (see MAX_RUN_DOWNLOAD_BUDGET_BYTES in data-update.py), so a
    # large backlog of new/updated maps drains automatically over consecutive runs.
    # Note: GitHub may delay very frequent schedules under high platform load - this is
    # expected and harmless here, since the next run just picks up where the last left off.
    - cron: "*/3 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Ensures two runs never execute in parallel: if a run is still going when the next
  # scheduled trigger fires, the new one queues instead of racing the current one.
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r update-scripts/requirements.txt

      - name: Run data-update.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u update-scripts/data-update.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/osmand-data.json data/moovitdos-link.json data/update-status.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: automatic data update ($(date -u +%Y-%m-%d))"
            git push
          fi
